# SonarCloud (gratuit pour un dépôt public). Voir docs/CI-CD.md pour l'activation.
sonar.organization=etie-pick202
sonar.projectKey=etie-pick202_jarvis
sonar.projectName=JARVIS

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.int.test.ts,**/e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/*.test.ts,**/*.test.tsx,**/e2e/**,**/*.config.ts

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.coverage.exclusions=**/server.ts,**/main.tsx,**/*.config.ts,**/e2e/**

sonar.sourceEncoding=UTF-8
