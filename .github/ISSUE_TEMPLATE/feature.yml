name: Fonctionnalité
description: Une tâche du plan de travail
labels: ["type: feature"]
body:
  - type: input
    id: ref
    attributes: { label: "Référence du plan de travail", placeholder: "G6-4" }
    validations: { required: true }
  - type: textarea
    id: detail
    attributes: { label: "Détail et comportement attendu" }
    validations: { required: true }
  - type: dropdown
    id: side
    attributes:
      label: Côté
      options: [Écran, Serveur, Écran + serveur, Infra, Hors code]
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: ["0 · Socle", "1 · Quotidien", "2 · Extension"]
    validations: { required: true }
