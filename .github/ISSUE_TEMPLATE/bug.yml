name: Anomalie
description: Quelque chose ne marche pas comme prévu
labels: ["type: bug"]
body:
  - type: textarea
    id: steps
    attributes: { label: "Étapes pour reproduire" }
    validations: { required: true }
  - type: dropdown
    id: role
    attributes:
      label: Rôle de l'utilisateur
      options: [PDG, Gérant, Caissier(ère), Livreur, Client]
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Résultat attendu et résultat obtenu" }
    validations: { required: true }
  - type: markdown
    attributes:
      value: "Ne joignez jamais de vraies données (clients, ventes, numéros de téléphone)."
