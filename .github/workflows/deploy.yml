# Déploiement par SSH sur le serveur (Docker Compose + Caddy). Désactivé tant que la variable de dépôt
# DEPLOY_ENABLED n'est pas égale à "true". Ne tourne JAMAIS sur une pull request : seulement sur main
# (test) et sur un tag vX.Y.Z (production, approbation obligatoire par l'environnement).
# Prérequis serveur et secrets : voir docs/CI-CD.md.
name: Déploiement

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: deploy-test
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Attendre la fin de la CI sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name=="verify" or .name=="docker-build")] | map(.conclusion) | join(",")')
            echo "verify,docker-build : $state"
            case "$state" in
              *failure*|*cancelled*) echo "::error::CI en échec, déploiement annulé."; exit 1 ;;
              success,success) exit 0 ;;
              *) ;;
            esac
            sleep 20
          done
          echo "::error::CI non terminée à temps."; exit 1
      - uses: ./.github/actions/deploy
        with:
          tag: sha-${{ github.sha }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          base-url: ${{ vars.BASE_URL }}

  production:
    name: deploy-production
    if: vars.DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # approbation obligatoire (required reviewers)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy
        with:
          tag: ${{ github.ref_name }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          base-url: ${{ vars.BASE_URL }}
