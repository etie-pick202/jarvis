name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests unitaires avec couverture
        run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/coverage/lcov.info"
          if-no-files-found: error
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jarvis:jarvis@localhost:5432/jarvis_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests d'intégration (API et base PostgreSQL)
        run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium (Playwright)
        run: pnpm --filter @jarvis/web exec playwright install --with-deps chromium
      - name: Tests de bout en bout (bureau et Android)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jarvis/web build
      - name: Performance et accessibilité (téléphone d'entrée de gamme)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  sonar:
    name: sonar
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Sonar configuré ?
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN absent, analyse SonarCloud ignorée (voir docs/CI-CD.md)."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
      - name: Chemins de couverture relatifs à la racine
        if: env.SONAR_TOKEN != ''
        run: |
          for f in apps/api apps/web packages/shared; do
            sed -i "s|^SF:|SF:$f/|" "$f/coverage/lcov.info"
          done
      - name: Analyse SonarCloud et porte qualité
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.qualitygate.wait=true

  no-ai-mentions:
    name: no-ai-mentions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Règle n°1 (aucune mention d'IA)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='claude|anthropic|chatgpt|openai|copilot|gemini|codex|\bgpt\b|\bllm\b|\bIA\b|generated with|co-authored-by:.*\b(ai|llm|gpt)\b'
          status=0
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -iEq "$PATTERN"; then
            echo "::error::Mention d'IA dans le titre ou la description de la PR (règle n°1)."
            status=1
          fi
          if git log "$BASE_SHA..$HEAD_SHA" --format='%B' | grep -iEq "$PATTERN"; then
            echo "::error::Mention d'IA dans un message de commit (règle n°1)."
            status=1
          fi
          exit $status

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            ci
            perf
