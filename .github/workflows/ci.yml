name: CI

on:
  pull_request:
  push:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests unitaires avec couverture
        run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: "**/coverage/lcov.info"
          if-no-files-found: error
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jarvis
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jarvis@localhost:5432/jarvis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests d'intégration (API et base PostgreSQL)
        run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium (Playwright)
        run: pnpm --filter @jarvis/web exec playwright install --with-deps chromium
      - name: Tests de bout en bout (bureau et Android)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jarvis/web build
      - name: Performance et accessibilité (téléphone d'entrée de gamme)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  sonar:
    name: sonar
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Sonar configuré ?
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN absent, analyse SonarCloud ignorée (voir docs/CI-CD.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
      - name: Chemins de couverture relatifs à la racine
        if: env.SONAR_TOKEN != ''
        run: |
          for f in apps/api apps/web packages/shared; do
            sed -i "s|^SF:|SF:$f/|" "$f/coverage/lcov.info"
          done
      - name: Analyse SonarCloud et porte qualité
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        with:
          args: -Dsonar.qualitygate.wait=true

  no-ai-mentions:
    name: no-ai-mentions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Règle n°1 (aucune mention d'IA)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='claude|anthropic|chatgpt|openai|copilot|gemini|codex|\bgpt\b|\bllm\b|\bIA\b|generated with|co-authored-by:.*\b(ai|llm|gpt)\b'
          status=0
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -iEq "$PATTERN"; then
            echo "::error::Mention d'IA dans le titre ou la description de la PR (règle n°1)."
            status=1
          fi
          if git log "$BASE_SHA..$HEAD_SHA" --format='%B' | grep -iEq "$PATTERN"; then
            echo "::error::Mention d'IA dans un message de commit (règle n°1)."
            status=1
          fi
          exit $status

  flux-branches:
    name: flux-branches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Respect du flux develop → staging → main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          # Fonctionnalités et corrections → develop ; develop → staging ; staging → main.
          # Exceptions : hotfix/* vers staging ou main, retour de main ou staging vers develop,
          # et la PR de version de release-please sur main.
          case "$BASE" in
            main)    case "$HEAD" in staging|hotfix/*|release-please--*) ok=1 ;; *) ok=0 ;; esac ;;
            staging) case "$HEAD" in develop|hotfix/*) ok=1 ;; *) ok=0 ;; esac ;;
            develop) ok=1 ;;
            *)       ok=1 ;;
          esac
          if [ "$ok" != 1 ]; then
            echo "::error::Une PR vers $BASE ne peut pas venir de $HEAD. Flux : branche de travail → develop → staging → main (hotfix/* autorisé vers staging et main)."
            exit 1
          fi
          echo "Flux respecté : $HEAD → $BASE"

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            ci
            perf
