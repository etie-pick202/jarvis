# Réglages lus par l'analyse automatique de SonarCloud (application « SonarCloud Code Analysis »).
# Elle ignore sonar-project.properties, qui ne sert qu'au job « sonar » de la CI (avec SONAR_TOKEN).
# Garder les deux fichiers alignés.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.int.test.ts,**/e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/*.test.ts,**/*.test.tsx,**/e2e/**,**/*.config.ts
sonar.cpd.exclusions=apps/web/src/i18n/**
sonar.sourceEncoding=UTF-8
